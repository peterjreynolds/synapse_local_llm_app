name: Build Synapse AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synapse-ai-apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_PATH: app/build/outputs/apk/synapse/Synapse-AI.apk
      APK_BRANCH: apk-latest
      RELEASE_TAG: synapse-ai
      EXPECTED_APPLICATION_ID: app.synapse.localllm.debug
      EXPECTED_SIGNING_CERTIFICATE_SHA256: 6f762970e8c29b2c810cb790c1e08dbebf80e40f60a03516b7ca665964a14e7b

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test release workflow policy
        shell: bash
        run: |
          node --test \
            scripts/ci/resolve-synapse-release-version.test.mjs \
            scripts/ci/run-idempotent-release-command-with-retry.test.mjs

      - name: Resolve monotonic release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_exists=0
          current_release_body=""
          if current_release_body="$(gh release view "$RELEASE_TAG" --json body --jq .body 2>/dev/null)"; then
            release_exists=1
          fi
          if [ "$release_exists" = "0" ] && git ls-remote --exit-code origin "refs/heads/$APK_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to reset versioning while the $APK_BRANCH distribution branch still exists." >&2
            exit 1
          fi
          release_version_json="$(
            printf '%s' "$current_release_body" |
              SYNAPSE_RELEASE_EXISTS="$release_exists" \
              node scripts/ci/resolve-synapse-release-version.mjs
          )"
          version_code="$(printf '%s' "$release_version_json" | jq -er '.versionCode')"
          version_name="$(printf '%s' "$release_version_json" | jq -er '.versionName')"
          printf 'SYNAPSE_VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
          printf 'SYNAPSE_VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'SYNAPSE_RELEASE_EXISTS=%s\n' "$release_exists" >> "$GITHUB_ENV"
          {
            printf '### Rolling APK version\n\n'
            printf -- '- Version code: `%s`\n' "$version_code"
            printf -- '- Version name: `%s`\n' "$version_name"
          } >> "$GITHUB_STEP_SUMMARY"

      # Robolectric's Android 16 (API 36) sandbox requires Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.31.6" \
            "ndk;29.0.13113456"

      - name: Restore stable debug signing key
        shell: bash
        env:
          SYNAPSE_DEBUG_KEYSTORE_B64: ${{ secrets.SYNAPSE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$SYNAPSE_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SYNAPSE_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using stable debug signing key from SYNAPSE_DEBUG_KEYSTORE_B64."
          else
            echo "SYNAPSE_DEBUG_KEYSTORE_B64 is not set. Android may require uninstall/reinstall between APKs."
          fi

      - name: Run unit tests
        shell: bash
        run: bash scripts/ci/run-gradle-with-retry.sh testDebugUnitTest --stacktrace

      - name: Run ktlint
        shell: bash
        run: bash scripts/ci/run-gradle-with-retry.sh ktlintCheck --stacktrace

      - name: Run Android lint
        shell: bash
        run: bash scripts/ci/run-gradle-with-retry.sh lintDebug --stacktrace

      - name: Assemble APK
        shell: bash
        run: bash scripts/ci/run-gradle-with-retry.sh assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH" | tee apk-sha256.txt
          actual_application_id="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$actual_application_id" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "Expected APK application id $EXPECTED_APPLICATION_ID, got $actual_application_id." >&2
            exit 1
          fi
          printf '%s\n' "$actual_application_id" | tee apk-application-id.txt
          actual_version_code="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          if [ "$actual_version_code" != "$SYNAPSE_VERSION_CODE" ]; then
            echo "Expected APK version code $SYNAPSE_VERSION_CODE, got $actual_version_code." >&2
            exit 1
          fi
          printf '%s\n' "$actual_version_code" | tee apk-version-code.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH" \
            | sed -n "s/^Signer #1 certificate SHA-256 digest: //p" \
            | tee apk-signer-sha256.txt
          test -s apk-signer-sha256.txt
          actual_signing_certificate_sha256="$(cat apk-signer-sha256.txt)"
          if [ "$actual_signing_certificate_sha256" != "$EXPECTED_SIGNING_CERTIFICATE_SHA256" ]; then
            echo "Expected APK signing certificate $EXPECTED_SIGNING_CERTIFICATE_SHA256, got $actual_signing_certificate_sha256." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-AI
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_code="$(cat apk-version-code.txt)"
          apk_sha256="$(cut -d ' ' -f 1 apk-sha256.txt)"
          application_id="$(cat apk-application-id.txt)"
          signer_sha256="$(cat apk-signer-sha256.txt)"
          release_notes="$(printf '%s\n\n' \
            "Latest automated Synapse AI APK from commit $GITHUB_SHA." \
            "Version code: $version_code. Package: $application_id." \
            "SHA-256: $apk_sha256. Signing certificate SHA-256: $signer_sha256." \
            "The synapse-ai release and apk-latest branch are updated together after every successful main build or explicit manual workflow dispatch.")"

          if [ "$SYNAPSE_RELEASE_EXISTS" = "1" ]; then
            SYNAPSE_RELEASE_OPERATION="upload rolling release asset" \
              bash scripts/ci/run-idempotent-release-command-with-retry.sh \
              gh release upload "$RELEASE_TAG" "$APK_PATH#Synapse-AI.apk" --clobber
            git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
            SYNAPSE_RELEASE_OPERATION="push rolling release tag" \
              bash scripts/ci/run-idempotent-release-command-with-retry.sh \
              git push --force origin "refs/tags/$RELEASE_TAG"
            SYNAPSE_RELEASE_OPERATION="update rolling release metadata" \
              bash scripts/ci/run-idempotent-release-command-with-retry.sh \
              gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Synapse AI APK" \
              --notes "$release_notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" "$APK_PATH#Synapse-AI.apk" \
              --target "$GITHUB_SHA" \
              --title "Synapse AI APK" \
              --notes "$release_notes" \
              --latest
          fi

      - name: Publish single-APK branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_root="$(mktemp -d)"
          mkdir -p "$publish_root/APK"
          cp "$APK_PATH" "$publish_root/APK/Synapse-AI.apk"
          apk_sha256="$(cut -d ' ' -f 1 apk-sha256.txt)"
          printf '%s  Synapse-AI.apk\n' "$apk_sha256" > "$publish_root/APK/Synapse-AI.apk.sha256"
          {
            printf '# Synapse AI APK\n\n'
            printf '%s\n\n' '`Synapse-AI.apk` is the latest APK produced by the approved rolling release workflow.'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Version code: `%s`\n' "$SYNAPSE_VERSION_CODE"
            printf -- '- SHA-256: `%s`\n\n' "$apk_sha256"
            printf '%s\n' 'This branch is force-replaced so it exposes one canonical APK without retaining old APK commits.'
          } > "$publish_root/APK/README.md"

          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git -C "$publish_root" init
          git -C "$publish_root" checkout -b "$APK_BRANCH"
          git -C "$publish_root" config user.name "github-actions[bot]"
          git -C "$publish_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_root" add APK/README.md APK/Synapse-AI.apk APK/Synapse-AI.apk.sha256
          git -C "$publish_root" commit -m "publish latest Synapse AI APK"
          git -C "$publish_root" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          SYNAPSE_RELEASE_OPERATION="publish rolling APK branch" \
            bash "$GITHUB_WORKSPACE/scripts/ci/run-idempotent-release-command-with-retry.sh" \
            git -C "$publish_root" -c "http.https://github.com/.extraheader=$auth_header" \
            push --force origin "$APK_BRANCH"

      - name: Verify rolling distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_apk_sha256="$(cut -d ' ' -f 1 apk-sha256.txt)"
          expected_asset_digest="sha256:$expected_apk_sha256"
          release_receipt_json="$(
            SYNAPSE_RELEASE_OPERATION="read rolling release receipt" \
              bash scripts/ci/run-idempotent-release-command-with-retry.sh \
              gh release view "$RELEASE_TAG" --json targetCommitish,assets
          )"
          release_target="$(printf '%s' "$release_receipt_json" | jq -r '.targetCommitish')"
          release_asset_count="$(
            printf '%s' "$release_receipt_json" \
              | jq -r '[.assets[] | select(.name == "Synapse-AI.apk")] | length'
          )"
          release_asset_digest="$(
            printf '%s' "$release_receipt_json" \
              | jq -r '.assets[] | select(.name == "Synapse-AI.apk") | .digest'
          )"
          remote_tag_sha="$(
            SYNAPSE_RELEASE_OPERATION="read rolling release tag" \
              bash scripts/ci/run-idempotent-release-command-with-retry.sh \
              git ls-remote origin "refs/tags/$RELEASE_TAG" \
              | awk '{print $1}'
          )"
          SYNAPSE_RELEASE_OPERATION="fetch rolling APK branch" \
            bash scripts/ci/run-idempotent-release-command-with-retry.sh \
            git fetch --force --depth=1 origin "$APK_BRANCH"
          branch_apk_sha256="$(git show FETCH_HEAD:APK/Synapse-AI.apk.sha256 | cut -d ' ' -f 1)"

          if [ "$release_target" != "$GITHUB_SHA" ]; then
            echo "Expected release target $GITHUB_SHA, got $release_target." >&2
            exit 1
          fi
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Expected release tag $GITHUB_SHA, got $remote_tag_sha." >&2
            exit 1
          fi
          if [ "$release_asset_count" != "1" ]; then
            echo "Expected one Synapse-AI.apk release asset, got $release_asset_count." >&2
            exit 1
          fi
          if [ "$release_asset_digest" != "$expected_asset_digest" ]; then
            echo "Expected release asset digest $expected_asset_digest, got $release_asset_digest." >&2
            exit 1
          fi
          if [ "$branch_apk_sha256" != "$expected_apk_sha256" ]; then
            echo "Expected apk-latest SHA-256 $expected_apk_sha256, got $branch_apk_sha256." >&2
            exit 1
          fi
          git show FETCH_HEAD:APK/README.md | grep -F "$GITHUB_SHA" >/dev/null
          {
            printf '\n### Rolling distribution receipt\n\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- APK SHA-256: `%s`\n' "$expected_apk_sha256"
            printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- APK branch: `%s`\n' "$APK_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
