name: Private chat recovery checks

on:
  push:
    branches:
      - ash/private-chat-http-recovery-20260906
      - codex/synapse-chat-supabase-migration
  pull_request:
    branches:
      - codex/supabase-private-chat
      - main
    paths:
      - privatechat/**
      - gradle/verification-metadata.xml
      - .github/workflows/private-chat-recovery-checks.yml
      - scripts/ci/verify-synapse-private-jni*
      - scripts/ci/build-packaged-signal-probe.sh
      - scripts/ci/packaged-signal-probe/**

permissions:
  contents: read

concurrency:
  group: private-chat-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package "tools"; command-line tools are installed separately.
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create disposable test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Synapse CI Test Only"
      - name: Unit tests, style, lint, and debug build
        run: ./gradlew :privatechat:test :privatechat:ktlintCheck :privatechat:lintDebug :privatechat:assembleDebug :privatechat:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify navigation on Android 7.1
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 25
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew :privatechat:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.synapse.privatechat.ui.chat.PrivateChatNavigationTest --stacktrace
      - name: Verify minified APK encryption boundary
        shell: bash
        run: |
          node --test scripts/ci/verify-synapse-private-jni.test.mjs
          bash scripts/ci/build-packaged-signal-probe.sh
          ./gradlew :privatechat:assembleRolling --stacktrace
          node scripts/ci/verify-synapse-private-jni.mjs \
            privatechat/build/outputs/apk/rolling/privatechat-rolling.apk \
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
