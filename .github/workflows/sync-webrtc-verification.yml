name: Sync WebRTC verification metadata

on:
  push:
    branches:
      - codex/synapse-chat-supabase-migration
    paths:
      - ".github/workflows/sync-webrtc-verification.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/synapse-chat-supabase-migration

      - name: Patch exact WebRTC verification hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text(encoding="utf-8")

          old_version = "144.7559.09"
          new_version = "144.7559.15"
          old_aar = "34cf91dd7497e5fe88adb76ba29ccae35db42dd6614ce548b79ce037b6d634d5"
          new_aar = "fc7c8d027eb33860ccbb7847988f7f942d44a92d1f575348bba6c0250cde4071"
          old_pom = "f807478688a10d8be6174968fbe26a4c5b993faaf1af45c1710c1e3f5243bb2f"
          new_pom = "9682ba549bd4d7732aa093427f09f597d9251ed7954b3df6a2b470d7cd356cf0"

          assert text.count(old_version) == 3
          assert text.count(old_aar) == 1
          assert text.count(old_pom) == 1

          text = text.replace(old_version, new_version)
          text = text.replace(old_aar, new_aar)
          text = text.replace(old_pom, new_pom)
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- gradle/verification-metadata.xml
          git diff -- gradle/verification-metadata.xml

      - name: Commit verification metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update WebRTC dependency verification metadata"
          git push origin HEAD:codex/synapse-chat-supabase-migration
